<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QSMbly has moved</title>
<link rel="canonical" href="https://webapps.neurodesk.org/qsmbly/">
<meta http-equiv="refresh" content="0; url=https://webapps.neurodesk.org/qsmbly/">
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((registrations) => registrations.forEach((registration) => registration.unregister()));
location.replace('https://webapps.neurodesk.org/qsmbly/' + location.search + location.hash);
</script>
</head>
<body>

</body>
